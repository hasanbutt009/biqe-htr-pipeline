# =============================================================================
# BIQE HTR Pipeline - Cloud Build CI/CD Configuration
# =============================================================================
# Automated build, test, and deployment to Cloud Run Jobs
#
# Triggers:
#   - Push to 'main' branch (production)
#   - Push to 'develop' branch (staging)
#
# Required Substitutions:
#   - _REGION: GCP region (e.g., us-central1)
#   - _JOB_NAME: Cloud Run Job name
#   - _ARTIFACT_REGISTRY: Artifact Registry repository path
# =============================================================================

substitutions:
  _REGION: us-central1
  _JOB_NAME: biqe-htr-job
  _ARTIFACT_REGISTRY: ${PROJECT_ID}/biqe-htr

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Run linting and type checks
  # ---------------------------------------------------------------------------
  - id: "lint"
    name: "python:3.11-slim"
    entrypoint: bash
    args:
      - -c
      - |
        pip install ruff mypy
        ruff check src/
        echo "✅ Linting passed"

  # ---------------------------------------------------------------------------
  # Step 2: Run unit tests
  # ---------------------------------------------------------------------------
  - id: "test"
    name: "python:3.11-slim"
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt
        pytest tests/ -v --tb=short
        echo "✅ Tests passed"
    waitFor: ["lint"]

  # ---------------------------------------------------------------------------
  # Step 3: Build Docker image
  # ---------------------------------------------------------------------------
  - id: "build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_ARTIFACT_REGISTRY}/${_JOB_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_ARTIFACT_REGISTRY}/${_JOB_NAME}:latest"
      - "-f"
      - "deploy/Dockerfile"
      - "."
    waitFor: ["test"]

  # ---------------------------------------------------------------------------
  # Step 4: Push to Artifact Registry
  # ---------------------------------------------------------------------------
  - id: "push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${_ARTIFACT_REGISTRY}/${_JOB_NAME}"
    waitFor: ["build"]

  # ---------------------------------------------------------------------------
  # Step 5: Deploy to Cloud Run Jobs
  # ---------------------------------------------------------------------------
  - id: "deploy"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${_ARTIFACT_REGISTRY}/${_JOB_NAME}:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--tasks"
      - "1"
      - "--max-retries"
      - "3"
      - "--task-timeout"
      - "3600s"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
    waitFor: ["push"]

# ---------------------------------------------------------------------------
# Build options
# ---------------------------------------------------------------------------
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# ---------------------------------------------------------------------------
# Artifacts - Store test results
# ---------------------------------------------------------------------------
artifacts:
  objects:
    location: "gs://${PROJECT_ID}-build-artifacts/${_JOB_NAME}/"
    paths:
      - "test-results.xml"

# ---------------------------------------------------------------------------
# Timeout
# ---------------------------------------------------------------------------
timeout: "1200s"

# ---------------------------------------------------------------------------
# Tags for filtering in Cloud Build history
# ---------------------------------------------------------------------------
tags:
  - "biqe-htr"
  - "cloud-run-jobs"
